name: Frontend Quality

on:
  push:
    paths:
      - 'App.tsx'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'jest.config.js'
      - 'jest.setup.ts'
      - '.eslintrc.cjs'
      - '.eslintignore'
      - '.github/workflows/frontend-quality.yml'
  pull_request:
    paths:
      - 'App.tsx'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'jest.config.js'
      - 'jest.setup.ts'
      - '.eslintrc.cjs'
      - '.eslintignore'
      - '.github/workflows/frontend-quality.yml'

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Typecheck frontend
        run: npm run typecheck:frontend

      - name: Typecheck root
        run: npm run typecheck:root

      - name: Lint frontend
        run: npm run lint:frontend

      - name: Test frontend
        run: npm run test:frontend
